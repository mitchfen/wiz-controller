name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "build-and-test-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Build Docker image
      run: docker build -t wiz-controller:test .

    - name: Run container
      run: |
        docker run -d --name wiz-controller -p 8080:80 wiz-controller:test
        sleep 2

    - name: Test site availability
      run: |
        # Retry up to 5 times with 1 second between attempts
        for i in {1..5}; do
          echo "Attempt $i: Testing http://localhost:8080/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:8080/ 2>&1)
          CURL_EXIT=$?
          echo "Response Code: $HTTP_CODE (curl exit: $CURL_EXIT)"
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ Site is accessible"
            break
          fi
          if [ $i -lt 5 ]; then
            echo "Retrying in 1 second..."
            sleep 1
          fi
        done
        
        # Get container logs for debugging
        docker logs wiz-controller
        
        # Final check
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "Error: Site returned $HTTP_CODE"
          exit 1
        fi

    - name: Verify HTML content
      run: |
        curl -s http://localhost:8080/ | grep -q "WiZ Controller" && echo "✓ HTML content verified"
