name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "build-and-test-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Build Docker image
      run: docker build -t wiz-controller:test .
